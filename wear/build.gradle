plugins { id 'com.android.application' }
android {
 namespace 'dev.ghostcode.wearinstaller.wear'; compileSdk 35
 defaultConfig { applicationId 'dev.ghostcode.wearinstaller'; minSdk 30; targetSdk 35; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 def signingProps = new Properties()
 def propsFile = rootProject.file('signing.properties')
 if (propsFile.exists()) signingProps.load(propsFile.newInputStream())
 signingConfigs {
  release {
   storeFile file(signingProps.getProperty('storeFile', System.getenv('WEARINSTALLER_KEYSTORE') ?: new File(System.getProperty('user.home'), '.local/share/wearinstaller/signing/release.p12').path))
   storePassword signingProps.getProperty('storePassword', System.getenv('WEARINSTALLER_STORE_PASSWORD') ?: (new File(System.getProperty('user.home'), '.local/share/wearinstaller/signing/password').exists() ? new File(System.getProperty('user.home'), '.local/share/wearinstaller/signing/password').text.trim() : ''))
   keyAlias signingProps.getProperty('keyAlias', 'wearinstaller')
   keyPassword signingProps.getProperty('keyPassword', storePassword)
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation project(':common')
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 
}
