pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
 repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
 repositories { google(); mavenCentral(); maven { url 'https://jitpack.io'; content { includeGroupByRegex 'com.github.MuntashirAkon.*' } } }
}
rootProject.name = 'WearInstaller'
include ':common', ':mobile', ':wear', ':test-apk', ':libadb'
// Opt-in laboratory app; never included in normal or release builds.
if (providers.gradleProperty('transportProbe').isPresent()) {
 include ':transport-probe'
 project(':transport-probe').projectDir = file('experiments/transport-probe')
}
